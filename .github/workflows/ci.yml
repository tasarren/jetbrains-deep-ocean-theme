name: CI

on:
  push:
    branches: [next, main]
  pull_request:
    branches: [next, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Validate themes and policies
        run: |
          node scripts/check-deep-ocean-theme.js
          node scripts/check-branch-policy.js --check
          node scripts/create-deep-ocean-vivid-variants.js
          git diff --exit-code -- src/main/resources
      - name: Build and inspect plugin
        run: |
          ./gradlew buildPlugin --no-daemon
          python3 scripts/check-plugin.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deep-ocean-dark
          path: build/distributions/deep-ocean-dark-*.zip
          if-no-files-found: error
